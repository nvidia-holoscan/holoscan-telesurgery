[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telesurgery-runtime"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["telesurgery-core", "telesurgery-robots"]

[tool.hatch.build.targets.wheel]
packages = ["src/telesurgery_runtime"]

[tool.hatch.build]
artifacts = ["src/telesurgery_runtime/backends/sdk5/*.so"]

[tool.hatch.build.hooks.custom]
