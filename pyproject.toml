[project]
name = "holoscan-telesurgery"
version = "0.3.0"
description = "Telesurgery dashboards and native GPU viewing with Holoscan"
requires-python = ">=3.12,<3.13"
dependencies = ["telesurgery-app"]

[project.optional-dependencies]
franka = ["telesurgery-robots[franka]"]
codecs-cu13 = ["cupy-cuda13x>=14,<15", "pynvvideocodec==2.2.3", "nvidia-nvimgcodec-cu13==0.9.0.20"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff==0.16.9", "pre-commit==4.6.2", "playwright>=1.50,<2"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
telesurgery-core = { workspace = true }
telesurgery-runtime = { workspace = true }
telesurgery-app = { workspace = true }
telesurgery-sim = { workspace = true }
telesurgery-robots = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires NVIDIA GPU and codec extras",
  "sdk: requires a Holoscan runtime",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
