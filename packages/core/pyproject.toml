[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telesurgery-core"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=4.10,<6", "pyzmq>=26,<28", "websocket-client>=1.8,<2", "cryptography>=46,<51", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/telesurgery_core"]
