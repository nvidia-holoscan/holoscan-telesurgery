name: Copyright
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  copyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uvx pre-commit==4.6.2 run check-license --all-files
