[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "telesurgery-robots"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "ruckig==0.19.4",
    "telesurgery-core",
]

[project.optional-dependencies]
franka = [
    "pin==4.1.0",
    "cmeel-urdfdom==6.0.0",
    "cmeel-tinyxml2==11.0.0",
    "nanobind==3.1.0",
    "cmake>=4,<5",
    "ninja",
]

[project.entry-points."telesurgery.robots"]
mira = "telesurgery_robots.mira.adapter:MiraAdapter"
franka = "telesurgery_robots.franka.adapter:Franka"
mira-sim = "telesurgery_robots.adapters.simulation:MiraSimulation"
franka-sim = "telesurgery_robots.adapters.simulation:FrankaSimulation"
versius-sim = "telesurgery_robots.adapters.simulation:VersiusSimulation"

[tool.hatch.build.targets.wheel]
packages = ["src/telesurgery_robots"]

[tool.hatch.build]
artifacts = ["src/telesurgery_robots/franka/*.so"]

[tool.hatch.build.hooks.custom]
