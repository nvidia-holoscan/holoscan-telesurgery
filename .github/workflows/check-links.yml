name: Check links
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "24 8 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --exclude-loopback --include-fragments --timeout 20 --max-retries 3 './**/*.md'
