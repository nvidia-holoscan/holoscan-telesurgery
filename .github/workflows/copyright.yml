name: Copyright
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  copyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uvx pre-commit==4.6.2 run check-license --all-files
