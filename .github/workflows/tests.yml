name: Software checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "24 8 * * 1"

permissions:
  contents: read

# A newer commit supersedes checks for the same PR; main and scheduled runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  portable:
    name: Unit tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk xvfb xauth
      # The portable suite does not build libfranka or use its Pinocchio toolchain.
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync playwright install --with-deps --only-shell chromium
      # Bound Chromium concurrency and redistribute work when a worker finishes early.
      - run: >-
          xvfb-run -a uv run --no-sync pytest -q -m 'not sdk and not gpu'
          -n 4 --dist worksteal --durations=20 --durations-min=1
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.21"
          python-version: "3.12"
      - run: uv export --locked --all-extras --no-emit-workspace --output-file /tmp/requirements.txt
      - run: uvx pip-audit==2.10.1 --disable-pip --require-hashes -r /tmp/requirements.txt
      - run: uvx bandit==1.9.4 -r packages scripts --severity-level medium -q
      - run: uvx zizmor==1.30.1 --offline --strict-collection .github/workflows
