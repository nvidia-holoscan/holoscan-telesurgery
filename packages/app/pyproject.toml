[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "telesurgery-app"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["telesurgery-core", "telesurgery-runtime", "telesurgery-sim", "aiohttp>=3.14.4,<4", "aiortc>=1.14,<2", "ifaddr>=0.2,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/telesurgery"]

[project.scripts]
telesurgery = "telesurgery.application.cli:main"
